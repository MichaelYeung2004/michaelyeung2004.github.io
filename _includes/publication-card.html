{% assign item = include.item %}
<div class="paper-box">
  <div class="paper-box-image"><div>
    <div class="badge">arXiv {{ item.year }}</div>
    <img src="{{ item.cover | relative_url }}" data-full-src="{{ item.full_cover | relative_url }}" class="progressive-image" alt="Overview of the VPT method" width="630" height="420" decoding="async">
  </div></div>
  <div class="paper-box-text">
    <p><a href="{{ item.links.arXiv }}">{{ item.title }}</a></p>
    <p>{{ item.authors }}</p>
    <div class="publication-meta"><span class="publication-venue publication-venue--preprint">{{ item.venue }}</span><span class="publication-year">{{ item.year }}</span></div>
    <div class="publication-links">
      <a class="publication-link" href="{{ item.links.arXiv }}">[Paper]</a>
      <a class="publication-link" href="{{ item.links.Project }}">[Project]</a>
      <a class="publication-link" href="{{ item.links.Code }}">[Code]</a>
    </div>
  </div>
</div>
