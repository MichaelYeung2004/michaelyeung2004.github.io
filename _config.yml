# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Zhen Yang (杨振) - Homepage"
description: "Zhen Yang is an undergraduate researcher at Sun Yat-sen University working on deep learning theory, computer vision, video generation, multimodal models, and medical imaging."
repository: "MichaelYeung2004/michaelyeung2004.github.io"
baseurl: ""
url: "https://michaelyeung2004.github.io"

author:
  name: "Zhen Yang (杨振)"
  avatar: "/assets/images/photos/yangzhen.png"
  bio: "B.S. student in Computer Science and Technology"
  location: "Guangzhou, China"
  employer: "Sun Yat-sen University"
  email: "yangzh273@mail2.sysu.edu.cn"
  github: "MichaelYeung2004"
  googlescholar: "https://scholar.google.com/citations?user=tHhfOMoAAAAJ&hl=en"
  twitter: "AliceDeRoss2"

# Build settings
markdown: kramdown
kramdown:
  math_engine: null
  parse_block_html: true
  parse_span_html: true
  hard_wrap: false
plugins:
  - jekyll-email-protect

