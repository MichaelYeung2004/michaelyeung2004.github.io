---
layout: compress
---
<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
<head>
  {% include head.html %}
  {% include head/custom.html %}
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>
<body class="blog-site">
  <div class="reading-progress" aria-hidden="true"></div>
  <header class="blog-nav">
    <a class="blog-brand" href="{{ '/' | relative_url }}" target="_self">Zhen Yang<span> / notes</span></a>
    <nav aria-label="Blog navigation">
      <a href="{{ '/' | relative_url }}" target="_self">Homepage</a>
      <a href="{{ '/blog/' | relative_url }}" target="_self" {% if page.permalink == '/blog/' %}aria-current="page"{% endif %}>Blog</a>
    </nav>
  </header>
  <main class="blog-main" id="top">{{ content }}</main>
  <footer class="blog-footer"><span>© {{ 'now' | date: '%Y' }} Zhen Yang</span><span>Notes, ideas &amp; little discoveries.</span><a href="#top" target="_self">Back to top ↑</a></footer>
  <script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>
</body>
</html>
